<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-page-margin md:p-xl relative overflow-hidden">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary-container via-background to-background"></div>
<div class="w-full max-w-md z-10">
<!-- Brand Header -->
<div class="mb-12 text-center md:text-left flex flex-col items-center gap-4">
<div class="w-12 h-12 bg-surface-container-high rounded-[8px] border border-outline-variant/30 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">analytics</span>
</div>
<div class="text-center">
<h1 class="font-display-lg text-display-lg hidden md:block text-on-background">EdgeJournal</h1>
<h1 class="font-display-lg-mobile text-display-lg-mobile block md:hidden text-on-background">EdgeJournal</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Secure professional trading environment.</p>
</div>
</div>
<!-- Login Form Card -->
<div class="bg-surface-container rounded-[8px] border border-outline-variant/20 p-6 md:p-8 shadow-2xl backdrop-blur-sm relative">
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-[48px] bg-surface-container-low border border-outline-variant/30 rounded-[8px] pl-10 pr-4 font-body-md text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline/50" id="email" placeholder="trader@edgejournal.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-[48px] bg-surface-container-low border border-outline-variant/30 rounded-[8px] pl-10 pr-10 font-body-md text-body-md text-on-background focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-background transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-4">
<button class="w-full h-[48px] bg-primary text-on-primary font-title-sm text-title-sm py-3 rounded-[8px] hover:bg-primary-container focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background transition-all shadow-[0_0_15px_rgba(192,193,255,0.1)] hover:shadow-[0_0_20px_rgba(192,193,255,0.2)] flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-6">
<div class="h-px bg-outline-variant/30 flex-grow"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">OR CONTINUE WITH</span>
<div class="h-px bg-outline-variant/30 flex-grow"></div>
</div>
<!-- Biometric / Alternative -->
<button class="w-full h-[48px] bg-transparent border border-outline-variant/40 text-on-background font-title-sm text-title-sm py-3 rounded-[8px] hover:bg-surface-container-high focus:ring-2 focus:ring-outline focus:ring-offset-2 focus:ring-offset-background transition-all flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined">fingerprint</span>
<span>Biometric Login</span>
</button>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary hover:text-primary-container font-medium transition-colors ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
</main>
</body></html>
