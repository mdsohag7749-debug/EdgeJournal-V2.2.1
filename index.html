<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EdgeJournal is a trading journal for tracking trades, reviewing performance, analyzing trading behavior, and improving execution — with pre-market plans, goals, reflections, and study notes."
    />
    <meta name="application-name" content="EdgeJournal" />
    <title>EdgeJournal — Trading Journal</title>

    <!-- Search engines: this is a personal, authenticated trading journal with
         no public content routes, so public crawling is intentionally declined. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="EdgeJournal" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EdgeJournal — Trading Journal" />
    <meta
      property="og:description"
      content="EdgeJournal is a trading journal for tracking trades, reviewing performance, analyzing trading behavior, and improving execution."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EdgeJournal — Trading Journal" />
    <meta
      name="twitter:description"
      content="EdgeJournal is a trading journal for tracking trades, reviewing performance, analyzing trading behavior, and improving execution."
    />

    <!-- Structured data: truthful, minimal WebApplication declaration. No
         ratings, reviews, pricing, or organization claims are made. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "EdgeJournal",
        "applicationCategory": "FinanceApplication",
        "description": "EdgeJournal is a trading journal for tracking trades, reviewing performance, analyzing trading behavior, and improving execution."
      }
    </script>

    <!-- PWA: manifest + install/theming metadata. Service worker
         registration itself happens in src/main.jsx via
         virtual:pwa-register, injected by vite-plugin-pwa at build
         time (see vite.config.js). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EdgeJournal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
